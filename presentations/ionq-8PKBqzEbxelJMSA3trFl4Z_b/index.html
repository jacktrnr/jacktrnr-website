<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="referrer" content="no-referrer"><title>Presentation</title>
<style>
*{box-sizing:border-box}body{background:#111;color:#eee;font:15px system-ui;margin:0;display:flex;flex-direction:column;height:100vh}button,input{font:inherit;padding:8px 12px}button{cursor:pointer}.unlock{margin:auto;width:min(90vw,400px);padding:28px;background:#222;border-radius:8px}.unlock h1{font-size:1.35rem;margin:0 0 12px}.unlock label{display:block;margin-bottom:8px}.unlock input{width:100%;margin-bottom:12px}.unlock button{width:100%}.error{color:#ffaaaa;min-height:1.3em}.bar{display:flex;align-items:center;justify-content:center;gap:1em;padding:8px;background:#222;flex-wrap:wrap}.bar button{padding:4px 12px}main{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}.slide{position:relative;width:min(100vw,calc((100vh - 55px)*4/3));aspect-ratio:4/3}.slide img{display:block;width:100%;height:100%;object-fit:fill}.hotspot{position:absolute;cursor:pointer;border:0;background:transparent;padding:0}.hotspot:focus-visible{outline:3px solid #ffb500}dialog{border:0;border-radius:8px;background:#181818;color:white;width:min(1100px,95vw);padding:12px}dialog::backdrop{background:#000c}dialog header{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px}video{width:100%;max-height:78vh;display:block;background:#000}[hidden]{display:none!important}
</style></head><body>
<form class="unlock" id="unlock"><h1>Presentation</h1><label for="password">Enter password</label><input id="password" type="password" autocomplete="current-password" autofocus required><button type="submit">Open presentation</button><p class="error" id="error" role="alert"></p></form>
<div class="bar" id="bar" hidden><button id="prev">← Previous</button><span id="count"></span><button id="next">Next →</button><button id="fullscreen">Full screen</button><span>Arrow keys · click a video to play</span></div>
<main id="main" hidden><div class="slide" id="slide"><img id="image" alt="Presentation slide"></div></main>
<dialog id="dialog"><header><span id="video-status">Presentation video</span><button id="close">Close ✕</button></header><video id="video" controls playsinline loop></video></dialog>
<script>
const salt=Uint8Array.from(atob('BdlF8k7E+rWVmaVbxeEv9Q=='),c=>c.charCodeAt(0)),iterations=600000;
let key,slides=[],current=0,displayed=-1,videoUrl=null,requestId=0,videoRequestId=0;
const slideCache=new Map(),maxCachedSlides=7;
const form=document.querySelector('#unlock'),error=document.querySelector('#error'),slide=document.querySelector('#slide'),img=document.querySelector('#image'),dialog=document.querySelector('#dialog'),video=document.querySelector('#video');
async function decrypt(path){const response=await fetch(path);if(!response.ok)throw new Error('Failed to load '+path);const data=await response.arrayBuffer();if(data.byteLength<29)throw new Error('Incomplete encrypted file');const iv=data.slice(0,12),cipher=data.slice(12);return crypto.subtle.decrypt({name:'AES-GCM',iv},key,cipher)}
form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='Opening…';const button=form.querySelector('button');button.disabled=true;try{const pass=document.querySelector('#password').value;const input=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},input,{name:'AES-GCM',length:256},false,['decrypt']);const decoded=await decrypt('manifest.bin');const manifest=JSON.parse(new TextDecoder().decode(decoded));slides=manifest.slides;document.querySelector('#password').value='';form.hidden=true;document.querySelector('#bar').hidden=false;document.querySelector('#main').hidden=false;await show((parseInt(location.hash.slice(1))||1)-1)}catch(err){console.error(err);key=null;error.textContent='Could not unlock. Check the password and try again.'}finally{button.disabled=false}});
function trimSlideCache(){
  const removable=[...slideCache.entries()].filter(([index,entry])=>entry.ready&&index!==current&&index!==displayed)
    .sort((a,b)=>Math.abs(b[0]-current)-Math.abs(a[0]-current));
  while(slideCache.size>maxCachedSlides&&removable.length){
    const [index,entry]=removable.shift();
    if(slideCache.get(index)!==entry)continue;
    slideCache.delete(index);URL.revokeObjectURL(entry.url);
  }
}
function loadSlide(index){
  const existing=slideCache.get(index);if(existing)return existing.promise;
  const entry={ready:false,url:null,image:null,promise:null};
  entry.promise=(async()=>{
    const stem=String(index+1).padStart(3,'0');
    const bytes=await decrypt('slides/'+stem+'.bin');
    const url=URL.createObjectURL(new Blob([bytes],{type:'image/png'}));
    entry.url=url;
    try{const image=new Image();image.src=url;await image.decode();entry.image=image;entry.ready=true;return entry}
    catch(err){URL.revokeObjectURL(url);entry.url=null;throw err}
  })().catch(err=>{if(slideCache.get(index)===entry)slideCache.delete(index);throw err});
  slideCache.set(index,entry);return entry.promise;
}
function prefetchNearby(index){
  for(const offset of [1,-1,2,-2,3]){
    const target=index+offset;if(target<0||target>=slides.length)continue;
    loadSlide(target).then(trimSlideCache).catch(err=>console.warn('Slide preload failed',err));
  }
}
async function show(n){
  current=Math.max(0,Math.min(slides.length-1,n));const target=current,active=++requestId;
  document.querySelector('#count').textContent=(target+1)+' / '+slides.length;
  slide.querySelectorAll('.hotspot').forEach(x=>x.remove());location.hash=String(target+1);
  try{
    const entry=await loadSlide(target);if(active!==requestId){trimSlideCache();return}
    img.src=entry.url;img.alt='Slide '+(target+1);displayed=target;
    for(const link of slides[target]){
      const b=document.createElement('button');b.className='hotspot';
      b.title=link.page!==undefined?'Go to slide':'Play video';b.setAttribute('aria-label',b.title);
      for(const k of ['left','top','width','height'])b.style[k]=link[k]+'%';
      b.onclick=()=>{if(link.page!==undefined){show(link.page);return}playVideo(link.url)};slide.appendChild(b);
    }
    prefetchNearby(target);trimSlideCache();
  }catch(err){if(active===requestId){console.error(err);document.querySelector('#count').textContent='Could not load slide'}}
}
async function playVideo(url){const active=++videoRequestId;document.querySelector('#video-status').textContent='Loading video…';dialog.showModal();try{const bytes=await decrypt(url);if(active!==videoRequestId||!dialog.open)return;if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));video.src=videoUrl;document.querySelector('#video-status').textContent='Presentation video';video.play().catch(()=>{})}catch(err){console.error(err);document.querySelector('#video-status').textContent='Could not load video'}}
function close(){videoRequestId++;video.pause();video.removeAttribute('src');video.load();if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=null;dialog.close()}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#close').onclick=close;document.querySelector('#fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};dialog.addEventListener('cancel',e=>{e.preventDefault();close()});document.addEventListener('keydown',e=>{if(dialog.open||form.hidden===false)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}});
</script></body></html>
